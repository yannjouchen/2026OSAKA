          JMA_FORECAST_BASE = "https://www.jma.go.jp/bosai/forecast/data/forecast"
          JMA_MULTI_ZHT = "https://www.data.jma.go.jp/multi/index.html?lang=cn_zt"
          JMA_TWOWEEK = "https://www.data.jma.go.jp/cpd/twoweek/"
          # Official JMA probability-guidance CSV used as the numerical basis for
          # the two-week temperature product. Each row is a five-day moving average.
          JMA_TWOWEEK_CSV = "https://www.data.jma.go.jp/risk/probability/guidance/download2w.php?2week_t_{station}.csv"

          def jma_date(iso_value):
              return str(iso_value or "")[:10]

          def jma_find_area(series, code):
              for area in (series or {}).get("areas") or []:
                  if str((area.get("area") or {}).get("code")) == str(code):
                      return area
              return None

          def jma_value_for_date(series, area_code, field, target_date):
              area = jma_find_area(series, area_code)
              if not area:
                  return None
              values = area.get(field) or []
              for i, t in enumerate((series or {}).get("timeDefines") or []):
                  if jma_date(t) == target_date and i < len(values):
                      v = values[i]
                      return v if v not in ("", None) else None
              return None

          def jma_short_temps(short_doc, temp_area_code, target_date):
              try:
                  series = short_doc["timeSeries"][2]
              except Exception:
                  return (None, None)
              area = jma_find_area(series, temp_area_code)
              if not area:
                  return (None, None)
              vals = []
              temps = area.get("temps") or []
              for i, t in enumerate(series.get("timeDefines") or []):
                  if jma_date(t) == target_date and i < len(temps):
                      try:
                          vals.append(float(temps[i]))
                      except Exception:
                          pass
              if not vals:
                  return (None, None)
              return (min(vals), max(vals))

          def jma_short_pop_blocks(short_doc, short_area_code, target_date):
              try:
                  series = short_doc["timeSeries"][1]
              except Exception:
                  return []
              area = jma_find_area(series, short_area_code)
              if not area:
                  return []
              pops = area.get("pops") or []
              blocks = []
              for i, t in enumerate(series.get("timeDefines") or []):
                  if jma_date(t) != target_date or i >= len(pops) or pops[i] in ("", None):
                      continue
                  try:
                      hour = int(str(t)[11:13])
                      pop = int(float(pops[i]))
                  except Exception:
                      continue
                  blocks.append({
                      "start": f"{hour:02d}:00",
                      "end": f"{(hour + 6) % 24:02d}:00",
                      "pop": pop,
                  })
              return blocks

          def jma_twoweek_record(target, raw_csv):
              from datetime import date as date_cls

              if not raw_csv:
                  return None
              try:
                  rows = list(csv.reader(io.StringIO(raw_csv)))
              except Exception:
                  return None
              if len(rows) < 2:
                  return None

              target_date = date_cls.fromisoformat(target["date"])
              period_start = target_date - timedelta(days=2)
              period_end = target_date + timedelta(days=2)

              initial_date = None
              initial_date_obj = None
              try:
                  initial_date_obj = date_cls(int(rows[0][0]), int(rows[0][1]), int(rows[0][2]))
                  initial_date = initial_date_obj.isoformat()
              except Exception:
                  pass

              # The published second-week product uses target dates 8–12 days
              # ahead. The underlying guidance file can contain additional moving
              # averages, so do not surface those extra rows as an official trip trend.
              if initial_date_obj is not None:
                  center_lead = (target_date - initial_date_obj).days
                  if center_lead < 8 or center_lead > 12:
                      return None

              values = {}
              normals = {}
              anomalies = {}
              elem_names = {"1": "avg", "2": "high", "3": "low"}

              for row in rows[1:]:
                  if len(row) < 215:
                      continue
                  try:
                      start = date_cls(int(row[0]), int(row[1]), int(row[2]))
                      end = date_cls(int(row[3]), int(row[4]), int(row[5]))
                  except Exception:
                      continue
                  if start != period_start or end != period_end:
                      continue

                  elem = elem_names.get(str(row[8]).strip())
                  if not elem:
                      continue
                  try:
                      anomaly_raw = float(row[10])
                      normal_raw = float(row[214])
                  except Exception:
                      continue
                  if anomaly_raw <= -9000 or normal_raw <= -9000:
                      continue

                  anomalies[elem] = anomaly_raw / 10.0
                  normals[elem] = normal_raw / 10.0
                  values[elem] = (anomaly_raw + normal_raw) / 10.0

              if "avg" not in values:
                  return None

              return {
                  "temperature_avg_5d": values.get("avg"),
                  "temperature_high_5d": values.get("high"),
                  "temperature_low_5d": values.get("low"),
                  "temperature_avg_5d_normal": normals.get("avg"),
                  "temperature_high_5d_normal": normals.get("high"),
                  "temperature_low_5d_normal": normals.get("low"),
                  "temperature_avg_5d_anomaly": anomalies.get("avg"),
                  "temperature_high_5d_anomaly": anomalies.get("high"),
                  "temperature_low_5d_anomaly": anomalies.get("low"),
                  "forecast_period_start": period_start.isoformat(),
                  "forecast_period_end": period_end.isoformat(),
                  "guidance_initial_date": initial_date,
                  "two_week_station_id": target.get("two_week_station_id"),
                  "two_week_station_name": target.get("two_week_station_name"),
              }

          def jma_weather_record(target, today, pref_docs, twoweek_docs):
              from datetime import date as date_cls

              target_date = date_cls.fromisoformat(target["date"])
              diff = (target_date - today).days
              base = {
                  "date": target["date"],
                  "label": target["label"],
                  "forecast_area": target["forecast_area"],
                  "source": "JMA",
                  "source_label": "日本氣象廳 JMA",
                  "official_zh_url": JMA_MULTI_ZHT,
                  "two_week_url": JMA_TWOWEEK,
              }

              if diff < 0:
                  return {
                      **base,
                      "status": "expired",
                      "mode": "expired",
                      "days_ahead": diff,
                  }

              # JMA daily weather forecasts are issued only through 7 days ahead.
              # For 8–12 days ahead, use JMA's official probability-guidance CSV
              # to show the five-day-average temperature trend centered on the trip date.
              if diff > 7:
                  if diff <= 12:
                      station = str(target.get("two_week_station_id"))
                      raw_tw = twoweek_docs.get(station)
                      if not raw_tw:
                          return {
                              **base,
                              "status": "unavailable",
                              "mode": "two_week",
                              "days_ahead": diff,
                              "error": "JMA two-week temperature CSV unavailable",
                          }
                      tw = jma_twoweek_record(target, raw_tw)
                      if tw:
                          return {
                              **base,
                              **tw,
                              "status": "ok",
                              "mode": "two_week",
                              "days_ahead": diff,
                          }
                      # Around the daily JMA update boundary, the newest guidance
                      # can still be based on the previous initial date. Treat this
                      # as waiting rather than as a fetch error; the next Action run
                      # will fill it automatically when the target enters days 8–12.
                      return {
                          **base,
                          "status": "not_available_yet",
                          "mode": "waiting",
                          "days_ahead": diff,
                      }
                  return {
                      **base,
                      "status": "not_available_yet",
                      "mode": "waiting",
                      "days_ahead": diff,
                  }

              docs = pref_docs.get(target["pref_code"])
              if not isinstance(docs, list) or len(docs) < 2:
                  return {
                      **base,
                      "status": "unavailable",
                      "mode": "jma",
                      "days_ahead": diff,
                      "error": "JMA forecast JSON unavailable",
                  }

              short_doc, weekly_doc = docs[0], docs[1]
              short_series = short_doc.get("timeSeries") or []
              weekly_series = weekly_doc.get("timeSeries") or []

              short_code = None
              short_text = None
              if short_series:
                  short_code = jma_value_for_date(
                      short_series[0], target["short_area_code"], "weatherCodes", target["date"]
                  )
                  short_text = jma_value_for_date(
                      short_series[0], target["short_area_code"], "weathers", target["date"]
                  )

              weekly_code = None
              daily_pop = None
              reliability = None
              tmin = tmax = None
              tmin_lo = tmin_hi = tmax_lo = tmax_hi = None
              if weekly_series:
                  weekly_code = jma_value_for_date(
                      weekly_series[0], target["weekly_area_code"], "weatherCodes", target["date"]
                  )
                  daily_pop = jma_value_for_date(
                      weekly_series[0], target["weekly_area_code"], "pops", target["date"]
                  )
                  reliability = jma_value_for_date(
                      weekly_series[0], target["weekly_area_code"], "reliabilities", target["date"]
                  )
              if len(weekly_series) > 1:
                  tseries = weekly_series[1]
                  tmin = jma_value_for_date(tseries, target["temp_area_code"], "tempsMin", target["date"])
                  tmax = jma_value_for_date(tseries, target["temp_area_code"], "tempsMax", target["date"])
                  tmin_lo = jma_value_for_date(tseries, target["temp_area_code"], "tempsMinLower", target["date"])
                  tmin_hi = jma_value_for_date(tseries, target["temp_area_code"], "tempsMinUpper", target["date"])
                  tmax_lo = jma_value_for_date(tseries, target["temp_area_code"], "tempsMaxLower", target["date"])
                  tmax_hi = jma_value_for_date(tseries, target["temp_area_code"], "tempsMaxUpper", target["date"])

              short_min, short_max = jma_short_temps(short_doc, target["temp_area_code"], target["date"])
              if tmin in (None, "") and short_min is not None:
                  tmin = short_min
              if tmax in (None, "") and short_max is not None:
                  tmax = short_max

              pop_blocks = jma_short_pop_blocks(short_doc, target["short_area_code"], target["date"])
              if daily_pop in (None, "") and pop_blocks:
                  daily_pop = max(x["pop"] for x in pop_blocks)

              weather_code = short_code or weekly_code
              if weather_code in (None, ""):
                  return {
                      **base,
                      "status": "not_available_yet",
                      "mode": "waiting",
                      "days_ahead": diff,
                  }

              mode = "short" if short_code not in (None, "") else "weekly"
              report_dt = short_doc.get("reportDatetime") if mode == "short" else weekly_doc.get("reportDatetime")
              office = short_doc.get("publishingOffice") if mode == "short" else weekly_doc.get("publishingOffice")

              return {
                  **base,
                  "status": "ok",
                  "mode": mode,
                  "days_ahead": diff,
                  "is_today": diff == 0,
                  "weather_code": str(weather_code),
                  "weather_text_ja": short_text,
                  "temperature_min": tmin,
                  "temperature_max": tmax,
                  "temperature_min_lower": tmin_lo,
                  "temperature_min_upper": tmin_hi,
                  "temperature_max_lower": tmax_lo,
                  "temperature_max_upper": tmax_hi,
                  "precipitation_probability": daily_pop,
                  "pop_6h": pop_blocks,
                  "reliability": reliability,
                  "publishing_office": office,
                  "report_datetime": report_dt,
              }

          def weather_bundle(now_utc, now_jst, previous_live=None):
              # JMA forecast products update a few times per day. Reuse an already
              # published JMA bundle for 30 minutes to avoid unnecessary requests.
              old = (previous_live or {}).get("_weather") or {}
              old_fetched = old.get("fetched_at")
              if (
                  old.get("source") == "JMA"
                  and old.get("twoweek_enabled") is True
                  and old_fetched
                  and old.get("places")
                  and set(WEATHER_TARGETS).issubset(set(old.get("places", {})))
              ):
                  try:
                      old_dt = datetime.fromisoformat(old_fetched.replace("Z", "+00:00"))
                      if (now_utc - old_dt).total_seconds() < 1800:
                          return old
                  except Exception:
                      pass

              # Fetch each prefecture only once, then reuse it for all cards in that prefecture.
              pref_docs = {}
              needed_pref_codes = sorted({t["pref_code"] for t in WEATHER_TARGETS.values()})
              for code in needed_pref_codes:
                  try:
                      pref_docs[code] = request_json(f"{JMA_FORECAST_BASE}/{code}.json")
                  except Exception as e:
                      print(f"JMA forecast fetch failed for {code}: {e}")
                      pref_docs[code] = None

              # Fetch the official two-week temperature guidance CSV only for
              # stations whose trip dates are currently 8–12 days ahead. Osaka is
              # reused by Day 1/3/4/5, so this stays to at most three CSV requests.
              twoweek_docs = {}
              needed_twoweek_stations = sorted({
                  str(t["two_week_station_id"])
                  for t in WEATHER_TARGETS.values()
                  if 8 <= (datetime.fromisoformat(t["date"]).date() - now_jst.date()).days <= 12
              })
              for station in needed_twoweek_stations:
                  try:
                      twoweek_docs[station] = request_text(JMA_TWOWEEK_CSV.format(station=station))
                  except Exception as e:
                      print(f"JMA two-week CSV fetch failed for {station}: {e}")
                      twoweek_docs[station] = None

              places = {}
              for key, target in WEATHER_TARGETS.items():
                  try:
                      places[key] = jma_weather_record(target, now_jst.date(), pref_docs, twoweek_docs)
                  except Exception as e:
                      places[key] = {
                          "status": "unavailable",
                          "date": target["date"],
                          "label": target["label"],
                          "forecast_area": target["forecast_area"],
                          "source": "JMA",
                          "source_label": "日本氣象廳 JMA",
                          "official_zh_url": JMA_MULTI_ZHT,
                          "two_week_url": JMA_TWOWEEK,
                          "error": str(e)[:250],
                      }

              return {
                  "fetched_at": now_utc.isoformat().replace("+00:00", "Z"),
                  "places": places,
                  "source": "JMA",
                  "official_zh_url": JMA_MULTI_ZHT,
                  "two_week_url": JMA_TWOWEEK,
                  "twoweek_enabled": True,
              }


          now_utc = datetime.now(timezone.utc)
          now_jst = now_utc.astimezone(JST)
          fetched_at = now_utc.isoformat().replace("+00:00", "Z")
          yesterday = now_jst.date() - timedelta(days=1)

          # Read the currently deployed JSON once so weather can be cached for 30 minutes.
          previous_live = None
          try:
              previous_live = request_json(previous_url + "?_=" + str(int(now_utc.timestamp())))
          except Exception as e:
              print(f"Previous live JSON unavailable for weather cache: {e}")

          try:
              data = request_json(queue_url)
              if not isinstance(data, dict):
                  raise ValueError("Queue-Times response is not a JSON object")

              rides = []
              if isinstance(data.get("rides"), list):
                  rides.extend(data["rides"])
              for land in data.get("lands") or []:
                  if isinstance(land, dict) and isinstance(land.get("rides"), list):
                      rides.extend(land["rides"])

              try:
                  history = yesterday_history(yesterday)
                  print(
                      "Yesterday crowd:",
                      history.get("date"),
                      history.get("crowd_percent"),
                      history.get("label"),
                      history.get("fetch_status"),
                  )
              except Exception as e:
                  print(f"Yesterday history failed: {e}")
                  history = {
                      "date": yesterday.isoformat(),
                      "crowd_percent": None,
                      "label": None,
                      "selected_avg_waits": {},
                      "error": str(e)[:300],
                  }

              data["_crowd"] = {
                  "yesterday": history,
                  "today_live": live_index(rides, fetched_at),
              }
              data["_weather"] = weather_bundle(now_utc, now_jst, previous_live)
              data["_usj_schedule"] = usj_official_schedule_bundle(now_utc, previous_live)
              data["_meta"] = {
                  "status": "ok",
                  "fetched_at": fetched_at,
                  "source": queue_url,
              }

              out.write_text(
                  json.dumps(data, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )
              print("Fresh queue + crowd summary written.")

          except Exception as fresh_error:
              print(f"Fresh fetch failed: {fresh_error}")

              try:
                  previous = request_json(previous_url)
                  previous["_meta"] = {
                      **(previous.get("_meta") or {}),
                      "status": "stale_fallback",
                      "attempted_at": fetched_at,
                      "error": str(fresh_error)[:300],
                  }
                  out.write_text(
                      json.dumps(previous, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8",
                  )
                  print("Previous live JSON used as fallback.")

              except Exception as previous_error:
                  print(f"Previous fallback also failed: {previous_error}")
                  fallback = {
                      "_meta": {
                          "status": "unavailable",
                          "attempted_at": fetched_at,
                          "source": queue_url,
                          "error": str(fresh_error)[:300],
                      },
                      "_crowd": {
                          "yesterday": {
                              "date": yesterday.isoformat(),
                              "crowd_percent": None,
                              "label": None,
                              "selected_avg_waits": {},
                          },
                          "today_live": {
                              "index": None,
                              "label": None,
                              "tracked_open_rides": 0,
                              "counts": {},
                              "calculated_at": fetched_at,
                          },
                      },
                      "_weather": weather_bundle(now_utc, now_jst, previous_live),
                      "_usj_schedule": usj_official_schedule_bundle(now_utc, previous_live),
                      "lands": [],
                      "rides": [],
                  }
                  out.write_text(
                      json.dumps(fallback, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8",
                  )

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
