name: USJ Queue → Deploy Pages

on:
  workflow_dispatch:

  # TEST MODE: run every 5 minutes, all day.
  # After testing succeeds, switch back to the Oct 11 trip-only schedule.
  schedule:
    - cron: "2-59/5 * * * *"
      timezone: "Asia/Tokyo"

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/

      - name: Fetch USJ queue, crowd, weather and official schedule
        shell: python
        env:
          QUEUE_URL: https://queue-times.com/parks/284/queue_times.json
          PREVIOUS_URL: https://yannjouchen.github.io/2026OSAKA/usj-queue.json
        run: |
          import html as html_lib
          import json
          import os
          import pathlib
          import re
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo

          out = pathlib.Path("_site/usj-queue.json")
          queue_url = os.environ["QUEUE_URL"]
          previous_url = os.environ["PREVIOUS_URL"]
          JST = ZoneInfo("Asia/Tokyo")

          def request_text(url, timeout=20):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Osaka-Trip-Dashboard/1.0 (+GitHub Actions)",
                      "Accept": "text/html,application/json;q=0.9,*/*;q=0.8",
                  },
              )
              with urllib.request.urlopen(req, timeout=timeout) as res:
                  return res.read().decode("utf-8", errors="replace")

          def request_json(url, timeout=20):
              return json.loads(request_text(url, timeout))

          def visible_text(raw):
              raw = re.sub(r"<script\b[^>]*>.*?</script>", " ", raw, flags=re.I|re.S)
              raw = re.sub(r"<style\b[^>]*>.*?</style>", " ", raw, flags=re.I|re.S)
              raw = re.sub(r"<[^>]+>", " ", raw)
              return re.sub(r"\s+", " ", html_lib.unescape(raw)).strip()

          def yesterday_history(day):
              daily_url = f"https://queue-times.com/en-US/parks/284/calendar/{day:%Y/%m/%d}"
              monthly_url = f"https://queue-times.com/en-US/parks/284/calendar/{day:%Y/%m}"

              errors = []
              text = ""

              # Primary: dedicated historical day page.
              try:
                  text = visible_text(request_text(daily_url))
              except Exception as e:
                  errors.append(f"daily page: {e}")

              crowd_percent = None
              label = None
              waits = {}

              if text:
                  # Expected visible sequence:
                  # Crowd level 58% Prediction error 32% Crowd level Busy
                  m = re.search(
                      r"\bCrowd level\s+(\d{1,3})%\s+Prediction error\s+\d{1,3}%\s+Crowd level\s+([A-Za-z]+)",
                      text,
                      re.I,
                  )
                  if m:
                      crowd_percent = int(m.group(1))
                      label = m.group(2)
                  else:
                      m = re.search(r"\bCrowd level\s+(\d{1,3})%", text, re.I)
                      if m:
                          crowd_percent = int(m.group(1))

                  # Parse selected average wait times from the day page.
                  m = re.search(
                      r"Average wait time by ride(.*?)Maximum wait time by ride",
                      text,
                      re.I,
                  )
                  avg_text = m.group(1) if m else ""

                  for name in [
                      "Mine Cart Madness™",
                      "Mario Kart: Koopa's Challenge™",
                      "Yoshi's Adventure™",
                      "Harry Potter and the Forbidden Journey™",
                      "Despicable Me Minion Mayhem",
                      "Hello Kitty's Ribbon Collection",
                      "Hello Kitty's Cupcake Dream",
                  ]:
                      mm = re.search(
                          re.escape(name) + r"\s+(?:Loading\.\.\.\s+)?(\d{1,3})(?:\s|$)",
                          avg_text,
                          re.I,
                      )
                      if mm:
                          waits[name] = int(mm.group(1))

              # Fallback: monthly crowd calendar if the dedicated day page
              # did not expose a usable Crowd level to urllib.
              if crowd_percent is None:
                  try:
                      month_text = visible_text(request_text(monthly_url))
                      # Search a small window around the target day entry.
                      day_num = str(day.day)
                      candidates = [
                          rf"\b{re.escape(day_num)}\s+[A-Za-z]{{3}}\s+{re.escape(day_num)}(?:\s+\S+)*?\s+(\d{{1,3}})%",
                          rf"\b[A-Za-z]{{3}}\s+{re.escape(day_num)}(?:\s+\S+)*?\s+(\d{{1,3}})%",
                      ]
                      for pat in candidates:
                          mm = re.search(pat, month_text, re.I)
                          if mm:
                              crowd_percent = int(mm.group(1))
                              break
                  except Exception as e:
                      errors.append(f"monthly page: {e}")

              # Derive a readable label if the percentage was found but text label was not.
              if crowd_percent is not None and not label:
                  if crowd_percent <= 20:
                      label = "Empty"
                  elif crowd_percent <= 45:
                      label = "Quiet"
                  elif crowd_percent <= 75:
                      label = "Busy"
                  else:
                      label = "Packed"

              return {
                  "date": day.isoformat(),
                  "crowd_percent": crowd_percent,
                  "label": label,
                  "selected_avg_waits": waits,
                  "source": daily_url,
                  "fallback_source": monthly_url,
                  "fetch_status": "ok" if crowd_percent is not None else "unavailable",
                  "errors": errors,
              }

          LIVE_WEIGHTS = {
              14402: 1.5,  # Mine Cart Madness
              12061: 1.5, # Mario Kart
              12071: 1.2, # Yoshi
              12065: 1.2, # Harry Potter
              12066: 1.0, # Minion Mayhem
              12068: 0.8, # JAWS
              7063: 0.7,  # Hello Kitty Ribbon
              7065: 0.6,  # Hello Kitty Cupcake
              7092: 1.0,  # Flying Dinosaur
              7077: 1.0,  # Hollywood Dream
          }

          def live_index(rides, calculated_at):
              weighted = 0.0
              total_weight = 0.0
              tracked = 0
              counts = {"green":0, "yellow":0, "orange":0, "red":0}

              for ride in rides:
                  if not ride.get("is_open"):
                      continue

                  wait = max(0, int(ride.get("wait_time") or 0))
                  if wait <= 30:
                      counts["green"] += 1
                  elif wait <= 60:
                      counts["yellow"] += 1
                  elif wait <= 100:
                      counts["orange"] += 1
                  else:
                      counts["red"] += 1

                  ride_id = int(ride.get("id") or 0)
                  weight = LIVE_WEIGHTS.get(ride_id)
                  if weight:
                      # 120 minutes or more = 100 points for that ride.
                      score = min(wait / 120.0, 1.0) * 100.0
                      weighted += score * weight
                      total_weight += weight
                      tracked += 1

              index = round(weighted / total_weight) if total_weight else None
              if index is None:
                  label = None
              elif index <= 25:
                  label = "很空"
              elif index <= 45:
                  label = "舒適"
              elif index <= 65:
                  label = "普通"
              elif index <= 80:
                  label = "擁擠"
              else:
                  label = "非常擁擠"

              return {
                  "index": index,
                  "label": label,
                  "tracked_open_rides": tracked,
                  "counts": counts,
                  "calculated_at": calculated_at,
                  "method": "custom weighted wait-time index; selected rides capped at 120 min = 100",
              }



          USJ_TRIP_DATE = "2026-10-11"
          USJ_HOURS_URL = "https://www.usj.co.jp/web/en/us/park-guide/schedule/park-hour2"
          USJ_SHOW_URL = "https://www.usj.co.jp/web/en/us/attractions/show-and-attraction-schedule?date=10%2F11%2F2026"

          SHOW_ZH = {
              "WaterWorld": "水世界",
              "NO LIMIT! Parade: Discover U!!! Version": "NO LIMIT! 遊行～Discover U!!! 版～",
              "Wicked: The Witches of Oz": "Wicked：奧茲女巫",
              "The Power of Rock: U Rock!": "The Power of Rock：U Rock!",
              "Kuromi Live: Discover Me, Discover U!!!": "酷洛米 Live：Discover Me, Discover U!!!",
              "The Ultimate Blues Bash": "The Ultimate Blues Bash",
              "Universal Wonderland: Let's Smile Together!": "環球奇境～Let's Smile Together!～",
              "Meet the Hogsmeade Magical Creatures": "霍格莫德魔法生物見面活動",
              "Hippogriff Magical Lesson": "鷹馬魔法課程",
              "Discover U!!! Time": "Discover U!!! Time",
              "ONE PIECE PREMIER SHOW 2026": "ONE PIECE PREMIER SHOW 2026",
              "Jurassic Park Dinosaur Meet & Greet": "侏羅紀公園恐龍見面活動",
          }

          def ampm_to_24h(value):
              m = re.match(r"^\s*(\d{1,2}):(\d{2})\s*([AP]M)\s*$", value, re.I)
              if not m:
                  return None
              hour = int(m.group(1))
              minute = int(m.group(2))
              ap = m.group(3).upper()
              if ap == "AM" and hour == 12:
                  hour = 0
              elif ap == "PM" and hour != 12:
                  hour += 12
              return f"{hour:02d}:{minute:02d}"

          def parse_park_hours():
              fetched = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
              try:
                  raw = request_text(USJ_HOURS_URL)
                  text = visible_text(raw)
                  patterns = [
                      r"\(Sun\)\s*Oct\.?\s*11,\s*2026\s+(\d{1,2}:\d{2}\s*[AP]M)\s*-\s*(\d{1,2}:\d{2}\s*[AP]M)",
                      r"Oct\.?\s*11,\s*2026\s+(\d{1,2}:\d{2}\s*[AP]M)\s*-\s*(\d{1,2}:\d{2}\s*[AP]M)",
                  ]
                  for pat in patterns:
                      m = re.search(pat, text, re.I)
                      if m:
                          op = ampm_to_24h(m.group(1))
                          cl = ampm_to_24h(m.group(2))
                          if op and cl:
                              return {
                                  "status": "ok",
                                  "date": USJ_TRIP_DATE,
                                  "open": op,
                                  "close": cl,
                                  "source": USJ_HOURS_URL,
                                  "fetched_at": fetched,
                              }

                  return {
                      "status": "not_published_yet",
                      "date": USJ_TRIP_DATE,
                      "open": None,
                      "close": None,
                      "source": USJ_HOURS_URL,
                      "fetched_at": fetched,
                  }
              except Exception as e:
                  return {
                      "status": "unavailable",
                      "date": USJ_TRIP_DATE,
                      "open": None,
                      "close": None,
                      "source": USJ_HOURS_URL,
                      "error": str(e)[:250],
                      "fetched_at": fetched,
                  }

          def parse_show_schedule():
              try:
                  raw = request_text(USJ_SHOW_URL)
                  text = visible_text(raw)

                  # USJ redirects/unavailable dates back to another day's schedule.
                  if not re.search(r"\bOct\.?\s*11,\s*2026\b", text, re.I):
                      return "not_published_yet", []

                  heads = list(re.finditer(r"<h3\b[^>]*>(.*?)</h3>", raw, re.I|re.S))
                  shows = []
                  for i, h in enumerate(heads):
                      name = visible_text(h.group(1))
                      end = heads[i+1].start() if i+1 < len(heads) else min(len(raw), h.end()+5000)
                      body = visible_text(raw[h.end():end])
                      times = re.findall(r"\b(?:1[0-2]|[1-9]):[0-5]\d\s*(?:AM|PM)\b", body, re.I)
                      # Deduplicate while preserving order.
                      seen = set()
                      ordered = []
                      for t in times:
                          t = re.sub(r"\s+", "", t.upper())
                          if t not in seen:
                              seen.add(t)
                              ordered.append(t)

                      if ordered and name not in {"To everyone who visits today", "Time Table"}:
                          shows.append({
                              "name": name,
                              "name_zh": SHOW_ZH.get(name, name),
                              "times": ordered,
                          })

                  # Deduplicate show names.
                  unique = []
                  seen_names = set()
                  for show in shows:
                      if show["name"] not in seen_names:
                          seen_names.add(show["name"])
                          unique.append(show)

                  return ("ok" if unique else "published_but_empty"), unique

              except Exception as e:
                  print(f"USJ show schedule parse failed: {e}")
                  return "unavailable", []

          def usj_official_schedule_bundle(now_utc, previous_live=None):
              old = (previous_live or {}).get("_usj_schedule") or {}
              old_fetched = old.get("fetched_at")
              if old_fetched:
                  try:
                      old_dt = datetime.fromisoformat(old_fetched.replace("Z", "+00:00"))
                      if (now_utc - old_dt).total_seconds() < 1800:
                          return old
                  except Exception:
                      pass

              park_hours = parse_park_hours()
              show_status, shows = parse_show_schedule()
              return {
                  "fetched_at": now_utc.isoformat().replace("+00:00", "Z"),
                  "park_hours": park_hours,
                  "show_schedule_status": show_status,
                  "shows": shows,
                  "specials": [
                      {
                          "name": "Frieren: Beyond Journey's End Story Walk -- Echoes of Adventure",
                          "name_zh": "葬送的芙莉蓮 故事徒步 ～追憶之旅～",
                          "type": "timed_entry",
                          "hours": "10:00～Park close",
                          "requires_official_app_eticket": True,
                      },
                      {
                          "name": "NO LIMIT! Parade: Discover U!!! Version",
                          "name_zh": "NO LIMIT! 遊行～Discover U!!! 版～",
                          "type": "parade",
                          "times": ["1:00PM"],
                          "duration_minutes": 40,
                      },
                  ],
              }


          WEATHER_TARGETS = {
              "osaka_day1": {
                  "date": "2026-10-09",
                  "label": "大阪・心齋橋",
                  "latitude": 34.673856,
                  "longitude": 135.498128,
              },
              "kyoto_day2": {
                  "date": "2026-10-10",
                  "label": "京都・清水寺",
                  "latitude": 34.9954951,
                  "longitude": 135.7763166,
              },
              "nara_day2": {
                  "date": "2026-10-10",
                  "label": "奈良公園",
                  "latitude": 34.685047,
                  "longitude": 135.843012,
              },
              "usj_day3": {
                  "date": "2026-10-11",
                  "label": "Universal Studios Japan",
                  "latitude": 34.6654,
                  "longitude": 135.4323,
              },
              "ikeda_day4": {
                  "date": "2026-10-12",
                  "label": "大阪・池田",
                  "latitude": 34.8180487,
                  "longitude": 135.4266758,
              },
              "umeda_day4": {
                  "date": "2026-10-12",
                  "label": "大阪・梅田",
                  "latitude": 34.7028866,
                  "longitude": 135.4953236,
              },
              "abeno_day5": {
                  "date": "2026-10-13",
                  "label": "大阪・阿倍野",
                  "latitude": 34.6448982,
                  "longitude": 135.5116009,
              },
              "rinku_day5": {
                  "date": "2026-10-13",
                  "label": "臨空城・KIX",
                  "latitude": 34.4107338,
                  "longitude": 135.2996108,
              },
          }

          WEATHER_DAILY_FORECAST = (
              "weather_code,temperature_2m_max,temperature_2m_min,"
              "precipitation_sum,rain_sum,precipitation_probability_max"
          )
          WEATHER_DAILY_HISTORY = (
              "weather_code,temperature_2m_max,temperature_2m_min,"
              "precipitation_sum,rain_sum,precipitation_hours"
          )

          def api_json(base, params, timeout=20):
              url = base + "?" + urllib.parse.urlencode(params)
              return request_json(url, timeout)

          def first_daily(data, key):
              daily = data.get("daily") or {}
              values = daily.get(key)
              if isinstance(values, list) and values:
                  return values[0]
              return None

          def weather_record(target, today):
              from datetime import date as date_cls

              target_date = date_cls.fromisoformat(target["date"])
              common = {
                  "latitude": target["latitude"],
                  "longitude": target["longitude"],
                  "timezone": "Asia/Tokyo",
                  "start_date": target["date"],
                  "end_date": target["date"],
              }

              def pack(data, mode, source_label):
                  daily = data.get("daily") or {}
                  times = daily.get("time") or []
                  if not times:
                      raise ValueError("No daily weather row returned")
                  return {
                      "status": "ok",
                      "date": target["date"],
                      "label": target["label"],
                      "mode": mode,
                      "is_today": target_date == today,
                      "weather_code": first_daily(data, "weather_code"),
                      "temperature_max": first_daily(data, "temperature_2m_max"),
                      "temperature_min": first_daily(data, "temperature_2m_min"),
                      "precipitation_sum": first_daily(data, "precipitation_sum"),
                      "rain_sum": first_daily(data, "rain_sum"),
                      "precipitation_probability_max": first_daily(data, "precipitation_probability_max"),
                      "precipitation_hours": first_daily(data, "precipitation_hours"),
                      "source_label": source_label,
                  }

              if target_date >= today:
                  params = {
                      **common,
                      "daily": WEATHER_DAILY_FORECAST,
                  }
                  try:
                      data = api_json("https://api.open-meteo.com/v1/forecast", params)
                      return pack(data, "forecast", "Open‑Meteo Forecast")
                  except Exception as e:
                      # Most commonly means the date has not entered the forecast horizon yet.
                      return {
                          "status": "not_available_yet",
                          "date": target["date"],
                          "label": target["label"],
                          "mode": "forecast",
                          "error": str(e)[:250],
                      }

              archive_params = {
                  **common,
                  "daily": WEATHER_DAILY_HISTORY,
              }
              try:
                  data = api_json("https://archive-api.open-meteo.com/v1/archive", archive_params)
                  return pack(data, "historical", "Open‑Meteo Historical Weather")
              except Exception as archive_error:
                  # Recent past may not yet be fully available in the long-term archive.
                  hist_params = {
                      **common,
                      "daily": WEATHER_DAILY_FORECAST,
                  }
                  try:
                      data = api_json(
                          "https://historical-forecast-api.open-meteo.com/v1/forecast",
                          hist_params,
                      )
                      rec = pack(data, "historical_forecast", "Open‑Meteo Historical Forecast")
                      rec["archive_error"] = str(archive_error)[:200]
                      return rec
                  except Exception as hist_error:
                      return {
                          "status": "unavailable",
                          "date": target["date"],
                          "label": target["label"],
                          "mode": "historical",
                          "error": str(hist_error)[:250],
                      }

          def weather_bundle(now_utc, now_jst, previous_live=None):
              # Weather changes much more slowly than queue times.
              # Reuse the previously published weather bundle for up to 30 minutes.
              old = (previous_live or {}).get("_weather") or {}
              old_fetched = old.get("fetched_at")
              if old_fetched and old.get("places") and set(WEATHER_TARGETS).issubset(set(old.get("places", {}))):
                  try:
                      old_dt = datetime.fromisoformat(old_fetched.replace("Z", "+00:00"))
                      if (now_utc - old_dt).total_seconds() < 1800:
                          return old
                  except Exception:
                      pass

              places = {}
              for key, target in WEATHER_TARGETS.items():
                  try:
                      places[key] = weather_record(target, now_jst.date())
                  except Exception as e:
                      places[key] = {
                          "status": "unavailable",
                          "date": target["date"],
                          "label": target["label"],
                          "error": str(e)[:250],
                      }

              return {
                  "fetched_at": now_utc.isoformat().replace("+00:00", "Z"),
                  "places": places,
                  "source": "Open‑Meteo",
              }


          now_utc = datetime.now(timezone.utc)
          now_jst = now_utc.astimezone(JST)
          fetched_at = now_utc.isoformat().replace("+00:00", "Z")
          yesterday = now_jst.date() - timedelta(days=1)

          # Read the currently deployed JSON once so weather can be cached for 30 minutes.
          previous_live = None
          try:
              previous_live = request_json(previous_url + "?_=" + str(int(now_utc.timestamp())))
          except Exception as e:
              print(f"Previous live JSON unavailable for weather cache: {e}")

          try:
              data = request_json(queue_url)
              if not isinstance(data, dict):
                  raise ValueError("Queue-Times response is not a JSON object")

              rides = []
              if isinstance(data.get("rides"), list):
                  rides.extend(data["rides"])
              for land in data.get("lands") or []:
                  if isinstance(land, dict) and isinstance(land.get("rides"), list):
                      rides.extend(land["rides"])

              try:
                  history = yesterday_history(yesterday)
                  print(
                      "Yesterday crowd:",
                      history.get("date"),
                      history.get("crowd_percent"),
                      history.get("label"),
                      history.get("fetch_status"),
                  )
              except Exception as e:
                  print(f"Yesterday history failed: {e}")
                  history = {
                      "date": yesterday.isoformat(),
                      "crowd_percent": None,
                      "label": None,
                      "selected_avg_waits": {},
                      "error": str(e)[:300],
                  }

              data["_crowd"] = {
                  "yesterday": history,
                  "today_live": live_index(rides, fetched_at),
              }
              data["_weather"] = weather_bundle(now_utc, now_jst, previous_live)
              data["_usj_schedule"] = usj_official_schedule_bundle(now_utc, previous_live)
              data["_meta"] = {
                  "status": "ok",
                  "fetched_at": fetched_at,
                  "source": queue_url,
              }

              out.write_text(
                  json.dumps(data, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )
              print("Fresh queue + crowd summary written.")

          except Exception as fresh_error:
              print(f"Fresh fetch failed: {fresh_error}")

              try:
                  previous = request_json(previous_url)
                  previous["_meta"] = {
                      **(previous.get("_meta") or {}),
                      "status": "stale_fallback",
                      "attempted_at": fetched_at,
                      "error": str(fresh_error)[:300],
                  }
                  out.write_text(
                      json.dumps(previous, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8",
                  )
                  print("Previous live JSON used as fallback.")

              except Exception as previous_error:
                  print(f"Previous fallback also failed: {previous_error}")
                  fallback = {
                      "_meta": {
                          "status": "unavailable",
                          "attempted_at": fetched_at,
                          "source": queue_url,
                          "error": str(fresh_error)[:300],
                      },
                      "_crowd": {
                          "yesterday": {
                              "date": yesterday.isoformat(),
                              "crowd_percent": None,
                              "label": None,
                              "selected_avg_waits": {},
                          },
                          "today_live": {
                              "index": None,
                              "label": None,
                              "tracked_open_rides": 0,
                              "counts": {},
                              "calculated_at": fetched_at,
                          },
                      },
                      "_weather": weather_bundle(now_utc, now_jst, previous_live),
                      "_usj_schedule": usj_official_schedule_bundle(now_utc, previous_live),
                      "lands": [],
                      "rides": [],
                  }
                  out.write_text(
                      json.dumps(fallback, ensure_ascii=False, separators=(",", ":")),
                      encoding="utf-8",
                  )

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
